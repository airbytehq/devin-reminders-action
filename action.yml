name: Devin Reminders Action
description: "Schedule, list, cancel, and fire reminders for Devin.ai sessions."
branding:
  icon: bell
  color: purple

inputs:
  action:
    description: "Action to perform: put, list, cancel, or cron"
    required: true
  remind-at:
    description: >
      ISO 8601 timestamp (with timezone offset) for when the reminder should fire.
      Required for 'put'. Must be in the future and no more than 3 days ahead.
      Example: 2026-02-20T17:00:00-08:00
    required: false
  reminder-message:
    description: "Reminder message to deliver (required for 'put')."
    required: false
  agent-session-url:
    description: "Devin session URL to ping when the reminder fires (required for 'put' and 'cancel')."
    required: false
  slack-users-cc:
    description: >
      Comma or newline-delimited list of Slack user tags to CC on notifications.
      Example: '<@U12345>, <@U67890>' or '@alice, @bob'.
      Only used when slack-channel is set.
    required: false
  devin-token:
    description: "Devin API Token (required for authentication when firing reminders)."
    required: true
  slack-token:
    description: "Slack bot token for posting notifications. Only needed if slack-channel is set."
    required: false
  slack-channel:
    description: "Slack channel name to post notifications to. Leave empty to skip Slack notifications."
    required: false
  reminder-timezone:
    description: >
      Timezone for displaying reminder times in notifications.
      Accepts IANA timezone names (e.g. America/Los_Angeles) or UTC offsets (e.g. -08:00).
      Does not affect parsing of remind-at (which must carry its own offset).
      Defaults to UTC.
    required: false
    default: "UTC"
  cancel-guids:
    description: >
      JSON array of reminder GUIDs to cancel (required for 'cancel' action).
      Example: '["abc-123", "def-456"]'
    required: false
  org-id:
    description: >
      Devin organization ID (required for v3 API). When set, the action uses
      v3 org-scoped endpoints instead of v1.
    required: false
  lock-mode:
    description: >
      Controls artifact-based locking to prevent race conditions.
      'auto' locks on put, cancel, and cron (default), 'none' disables locking,
      'always' locks on all actions including list.
    required: false
    default: "auto"
  undeliverable-cc:
    description: >
      Slack user or group tags to CC when a reminder is dropped because its
      session is unreachable (HTTP 403/404/410). Example: '<!subteam^S12345>'.
      Only used when slack-channel is set.
    required: false

outputs:
  reminders-json:
    description: "JSON array of all current reminders"
    value: ${{ steps.list.outputs.reminders_json }}
  due-json:
    description: "JSON array of reminders that are currently due"
    value: ${{ steps.list.outputs.due_json }}
  due-count:
    description: "Number of reminders currently due"
    value: ${{ steps.list.outputs.due_count }}
  total-count:
    description: "Total number of reminders in the list"
    value: ${{ steps.list.outputs.total_count }}
  item-guid:
    description: "GUID of the newly added reminder (only set for put action)"
    value: ${{ steps.resolve.outputs.item_guid }}
  due-guids:
    description: "Newline-delimited list of GUIDs for due reminders"
    value: ${{ steps.list.outputs.due_guids }}
  popped-count:
    description: "Number of reminders removed after cron firing"
    value: ${{ steps.pop.outputs.popped_count }}
  failed-count:
    description: "Number of reminders that failed to fire (only set for cron action)"
    value: ${{ steps.cron.outputs.failed_count }}
  undeliverable-count:
    description: "Number of reminders dropped because the target session was unreachable (only set for cron action)"
    value: ${{ steps.cron.outputs.undeliverable_count }}
  cancelled-count:
    description: "Number of reminders cancelled (only set for cancel action)"
    value: ${{ steps.cancel-build.outputs.cancelled_count }}

runs:
  using: "composite"
  steps:

    - name: Resolve and validate inputs
      id: resolve
      shell: bash
      env:
        INPUT_ACTION: ${{ inputs.action }}
        INPUT_REMIND_AT: ${{ inputs.remind-at }}
        INPUT_REMINDER_MESSAGE: ${{ inputs.reminder-message }}
        INPUT_AGENT_SESSION_URL: ${{ inputs.agent-session-url }}
        INPUT_SLACK_USERS_CC: ${{ inputs.slack-users-cc }}
        INPUT_TIMEZONE: ${{ inputs.reminder-timezone }}
      run: |
        set -euo pipefail

        echo "action=${INPUT_ACTION}" | tee -a "$GITHUB_OUTPUT"
        echo "is_put=$( [ "${INPUT_ACTION}" = "put" ] && echo true || echo false )" | tee -a "$GITHUB_OUTPUT"
        echo "is_list=$( [ "${INPUT_ACTION}" = "list" ] && echo true || echo false )" | tee -a "$GITHUB_OUTPUT"
        echo "is_cron=$( [ "${INPUT_ACTION}" = "cron" ] && echo true || echo false )" | tee -a "$GITHUB_OUTPUT"
        echo "is_cancel=$( [ "${INPUT_ACTION}" = "cancel" ] && echo true || echo false )" | tee -a "$GITHUB_OUTPUT"

        echo "artifact_name=devin-reminders-list" | tee -a "$GITHUB_OUTPUT"

        echo "reminder_message: ${INPUT_REMINDER_MESSAGE}"
        {
          echo "reminder_message<<GHEOF"
          echo "${INPUT_REMINDER_MESSAGE}"
          echo "GHEOF"
        } >> "$GITHUB_OUTPUT"

        echo "agent_session_url: ${INPUT_AGENT_SESSION_URL}"
        {
          echo "agent_session_url<<GHEOF"
          echo "${INPUT_AGENT_SESSION_URL}"
          echo "GHEOF"
        } >> "$GITHUB_OUTPUT"

        SLACK_USERS_CC="$(echo "${INPUT_SLACK_USERS_CC}" | tr '\n' ',' | sed 's/,\+/, /g; s/^[, ]\+//; s/[, ]\+$//')"
        echo "slack_users_cc=${SLACK_USERS_CC}" | tee -a "$GITHUB_OUTPUT"

        if [ -n "${INPUT_AGENT_SESSION_URL}" ]; then
          SESSION_ID="$(echo "${INPUT_AGENT_SESSION_URL}" | sed -E 's#.*/sessions/([^/?]+).*#\1#')"
          echo "session_id_short=${SESSION_ID:0:8}" | tee -a "$GITHUB_OUTPUT"
        else
          echo "session_id_short=" | tee -a "$GITHUB_OUTPUT"
        fi

        NOW="$(date -u +%Y-%m-%dT%H:%M:%S+00:00)"
        echo "now=${NOW}" | tee -a "$GITHUB_OUTPUT"

        GUID="$(uuidgen | tr '[:upper:]' '[:lower:]')"
        echo "item_guid=${GUID}" | tee -a "$GITHUB_OUTPUT"

        if [ -n "${INPUT_REMIND_AT}" ]; then
          REMIND_AT_UTC="$(date -u -d "${INPUT_REMIND_AT}" +%Y-%m-%dT%H:%M:%S+00:00)"
          echo "remind_at=${REMIND_AT_UTC}" | tee -a "$GITHUB_OUTPUT"

          REMIND_AT_DISPLAY="$(TZ="${INPUT_TIMEZONE}" date -d "${INPUT_REMIND_AT}" '+%Y-%m-%d %I:%M %p %Z')"
          echo "remind_at_display=${REMIND_AT_DISPLAY}" | tee -a "$GITHUB_OUTPUT"
        else
          echo "remind_at=" | tee -a "$GITHUB_OUTPUT"
          echo "remind_at_display=" | tee -a "$GITHUB_OUTPUT"
        fi

    - name: Validate put inputs
      if: steps.resolve.outputs.is_put == 'true'
      shell: bash
      env:
        REMIND_AT: ${{ steps.resolve.outputs.remind_at }}
        NOW: ${{ steps.resolve.outputs.now }}
        MESSAGE: ${{ steps.resolve.outputs.reminder_message }}
        SESSION_URL: ${{ steps.resolve.outputs.agent_session_url }}
      run: |
        set -euo pipefail

        echo "Validating put inputs..."

        test -n "${MESSAGE}" || { echo "::error::reminder-message is required for put"; exit 1; }
        test -n "${SESSION_URL}" || { echo "::error::agent-session-url is required for put"; exit 1; }
        test -n "${REMIND_AT}" || { echo "::error::remind-at is required for put"; exit 1; }

        NOW_EPOCH="$(date -u -d "${NOW}" +%s)"
        REMIND_EPOCH="$(date -u -d "${REMIND_AT}" +%s)"
        MAX_EPOCH=$(( NOW_EPOCH + 3 * 24 * 60 * 60 ))

        if [ "${REMIND_EPOCH}" -le "${NOW_EPOCH}" ]; then
          echo "::error::remind-at must be in the future"
          exit 1
        fi

        if [ "${REMIND_EPOCH}" -gt "${MAX_EPOCH}" ]; then
          echo "::error::remind-at must be no more than 3 days in the future"
          exit 1
        fi

        echo "Validation passed."

    - name: Validate cancel inputs
      if: steps.resolve.outputs.is_cancel == 'true'
      shell: bash
      env:
        CANCEL_GUIDS: ${{ inputs.cancel-guids }}
        SESSION_URL: ${{ steps.resolve.outputs.agent_session_url }}
      run: |
        set -euo pipefail

        echo "Validating cancel inputs..."

        test -n "${SESSION_URL}" || { echo "::error::agent-session-url is required for cancel"; exit 1; }
        test -n "${CANCEL_GUIDS}" || { echo "::error::cancel-guids is required for cancel"; exit 1; }

        echo "${CANCEL_GUIDS}" | jq -e 'type == "array" and all(.[]; type == "string")' >/dev/null 2>&1 || { echo "::error::cancel-guids must be a JSON array of strings"; exit 1; }

        echo "Validation passed."

    - name: Purge expired lock artifacts
      if: >
        (inputs.lock-mode == 'always') ||
        (inputs.lock-mode == 'auto' && steps.resolve.outputs.is_list != 'true')
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail

        # Expired artifacts stay listed by the artifacts API, and the lock action
        # treats any listed artifact as a held lock, so an expired lock deadlocks
        # every subsequent run until it is deleted.
        RESULT=$(curl -s -H "Authorization: Bearer ${GH_TOKEN}" \
          "https://api.github.com/repos/${{ github.repository }}/actions/artifacts?name=devin-reminders-lock&per_page=100")
        EXPIRED_IDS=$(echo "${RESULT}" | jq -r '.artifacts[] | select(.expired == true) | .id')

        for artifact_id in ${EXPIRED_IDS}; do
          echo "Deleting expired lock artifact ${artifact_id}"
          curl -fsS -X DELETE -H "Authorization: Bearer ${GH_TOKEN}" \
            "https://api.github.com/repos/${{ github.repository }}/actions/artifacts/${artifact_id}" \
            || echo "::warning::Could not delete expired lock artifact ${artifact_id}"
        done

    - name: Acquire artifact lock
      id: lock-acquire
      if: >
        (inputs.lock-mode == 'always') ||
        (inputs.lock-mode == 'auto' && steps.resolve.outputs.is_list != 'true')
      uses: guibranco/github-artifact-lock-action@v3.0.14
      with:
        lock-name: devin-reminders-lock
        retry-wait: "10"
        retry-max: "30"

    - name: Find latest artifact run
      id: find-artifact
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        RESULT=$(curl -s -H "Authorization: Bearer ${GH_TOKEN}" \
          "https://api.github.com/repos/${{ github.repository }}/actions/artifacts?name=${{ steps.resolve.outputs.artifact_name }}&per_page=1")
        RUN_ID=$(echo "${RESULT}" | jq -r '[.artifacts[] | select(.expired == false)][0].workflow_run.id // empty')
        if [ -n "${RUN_ID}" ]; then
          echo "Found artifact in run ${RUN_ID}"
          echo "run_id=${RUN_ID}" >> "$GITHUB_OUTPUT"
        else
          echo "No existing artifact found"
        fi

    - name: Download reminders artifact
      id: download
      if: steps.find-artifact.outputs.run_id != ''
      uses: actions/download-artifact@v4
      with:
        name: ${{ steps.resolve.outputs.artifact_name }}
        path: /tmp/reminders-artifact
        github-token: ${{ github.token }}
        run-id: ${{ steps.find-artifact.outputs.run_id }}

    - name: Read and filter reminders
      id: list
      shell: bash
      run: |
        set -euo pipefail

        NOW="${{ steps.resolve.outputs.now }}"

        FILE="/tmp/reminders-artifact/reminders.json"
        echo "Current time: ${NOW}"

        REMINDERS="[]"
        test -f "${FILE}" && REMINDERS="$(cat "${FILE}")"

        TOTAL="$(echo "${REMINDERS}" | jq 'length')"
        echo "total_count=${TOTAL}" | tee -a "$GITHUB_OUTPUT"

        DUE="$(echo "${REMINDERS}" | jq -c --arg now "${NOW}" '[.[] | select(.remind_at <= $now)]')"
        DUE_COUNT="$(echo "${DUE}" | jq 'length')"
        echo "due_count=${DUE_COUNT}" | tee -a "$GITHUB_OUTPUT"

        echo "reminders_json=$(echo "${REMINDERS}" | jq -c .)" | tee -a "$GITHUB_OUTPUT"
        echo "due_json=$(echo "${DUE}" | jq -c .)" | tee -a "$GITHUB_OUTPUT"

        {
          echo "due_guids<<GHEOF"
          echo "${DUE}" | jq -r '.[].guid'
          echo "GHEOF"
        } >> "$GITHUB_OUTPUT"

        echo "📋 **Reminders** at \`${NOW}\` — ${TOTAL} total, ${DUE_COUNT} due." | tee -a "$GITHUB_STEP_SUMMARY"

    # --- PUT steps ---

    - name: Build updated reminders list (put)
      id: put-build
      if: steps.resolve.outputs.is_put == 'true'
      shell: bash
      env:
        CURRENT_JSON: ${{ steps.list.outputs.reminders_json }}
        ITEM_GUID: ${{ steps.resolve.outputs.item_guid }}
        REMINDER_MESSAGE: ${{ steps.resolve.outputs.reminder_message }}
        AGENT_SESSION_URL: ${{ steps.resolve.outputs.agent_session_url }}
        REMIND_AT: ${{ steps.resolve.outputs.remind_at }}
        SLACK_USERS_CC: ${{ steps.resolve.outputs.slack_users_cc }}
      run: |
        set -euo pipefail

        test -n "${CURRENT_JSON}" || CURRENT_JSON="[]"

        SESSION_ID="$(echo "${AGENT_SESSION_URL}" | sed -E 's#.*/sessions/([^/?]+).*#\1#')"
        SESSION_ID_SHORT="${SESSION_ID:0:8}"

        NEW_ITEM="$(jq -n \
          --arg guid "${ITEM_GUID}" \
          --arg msg "${REMINDER_MESSAGE}" \
          --arg url "${AGENT_SESSION_URL}" \
          --arg remind "${REMIND_AT}" \
          --arg cc "${SLACK_USERS_CC}" \
          --arg sid_short "${SESSION_ID_SHORT}" \
          --arg created "$(date -u +%Y-%m-%dT%H:%M:%S+00:00)" \
          '{
            guid: $guid,
            reminder_message: $msg,
            agent_session_url: $url,
            remind_at: $remind,
            created_at: $created,
            slack_users_cc: (if $cc == "" then null else $cc end),
            session_id_short: $sid_short
          }')"

        UPDATED="$(echo "${CURRENT_JSON}" | jq -c --argjson item "${NEW_ITEM}" '. + [$item]')"

        mkdir -p /tmp/reminders-upload
        echo "${UPDATED}" | jq . > /tmp/reminders-upload/reminders.json

        echo "Updated list:"
        cat /tmp/reminders-upload/reminders.json

        TOTAL="$(echo "${UPDATED}" | jq 'length')"
        echo "total_count=${TOTAL}" | tee -a "$GITHUB_OUTPUT"

    - name: Upload reminders artifact (put)
      if: steps.resolve.outputs.is_put == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: ${{ steps.resolve.outputs.artifact_name }}
        path: /tmp/reminders-upload/reminders.json
        retention-days: 4
        overwrite: true

    - name: Slack notification (put)
      if: steps.resolve.outputs.is_put == 'true' && inputs.slack-channel != ''
      uses: slackapi/slack-github-action@v2
      with:
        method: chat.postMessage
        token: ${{ inputs.slack-token }}
        errors: true
        payload: |
          channel: "${{ inputs.slack-channel }}"
          unfurl_links: false
          unfurl_media: false
          blocks:
            - type: section
              text:
                type: mrkdwn
                text: ":pushpin: New Devin reminder scheduled for `${{ steps.resolve.outputs.remind_at_display }}`:"
            - type: section
              text:
                type: mrkdwn
                text: "> *${{ steps.resolve.outputs.reminder_message }}*"
            - type: context
              elements:
                - type: mrkdwn
                  text: "Sent by <http://Devin.ai|Devin.ai> (No-Reply) from session <${{ steps.resolve.outputs.agent_session_url }}|${{ steps.resolve.outputs.session_id_short }}>.${{ steps.resolve.outputs.slack_users_cc != '' && format(' CC: {0}', steps.resolve.outputs.slack_users_cc) || '' }}"

    - name: Print put result
      if: steps.resolve.outputs.is_put == 'true'
      shell: bash
      run: |
        echo -e "📌 **Reminder scheduled**\n- time: \`${{ steps.resolve.outputs.remind_at_display }}\`\n- session: [${{ steps.resolve.outputs.session_id_short }}](${{ steps.resolve.outputs.agent_session_url }})\n- total: ${{ steps.put-build.outputs.total_count }}" | tee -a "$GITHUB_STEP_SUMMARY"

    # --- CANCEL steps ---

    - name: Build updated reminders list (cancel)
      id: cancel-build
      if: steps.resolve.outputs.is_cancel == 'true'
      shell: bash
      env:
        CURRENT_JSON: ${{ steps.list.outputs.reminders_json }}
        CANCEL_GUIDS: ${{ inputs.cancel-guids }}
        SESSION_URL: ${{ steps.resolve.outputs.agent_session_url }}
      run: |
        set -euo pipefail

        test -n "${CURRENT_JSON}" || CURRENT_JSON="[]"

        BEFORE_COUNT="$(echo "${CURRENT_JSON}" | jq 'length')"

        REMAINING="${CURRENT_JSON}"

        REMAINING="$(echo "${REMAINING}" | jq -c --arg url "${SESSION_URL}" --argjson guids "${CANCEL_GUIDS}" '[.[] | select(.agent_session_url != $url or (.guid as $g | $guids | index($g) | not))]')"

        AFTER_COUNT="$(echo "${REMAINING}" | jq 'length')"
        CANCELLED_COUNT=$(( BEFORE_COUNT - AFTER_COUNT ))

        mkdir -p /tmp/reminders-upload
        echo "${REMAINING}" | jq . > /tmp/reminders-upload/reminders.json

        echo "Cancelled ${CANCELLED_COUNT} reminder(s). Remaining:"
        cat /tmp/reminders-upload/reminders.json

        echo "cancelled_count=${CANCELLED_COUNT}" | tee -a "$GITHUB_OUTPUT"
        echo "remaining_count=${AFTER_COUNT}" | tee -a "$GITHUB_OUTPUT"

    - name: Upload reminders artifact (cancel)
      if: steps.resolve.outputs.is_cancel == 'true' && steps.cancel-build.outputs.cancelled_count != '0'
      uses: actions/upload-artifact@v4
      with:
        name: ${{ steps.resolve.outputs.artifact_name }}
        path: /tmp/reminders-upload/reminders.json
        retention-days: 4
        overwrite: true

    - name: Slack notification (cancel)
      if: steps.resolve.outputs.is_cancel == 'true' && steps.cancel-build.outputs.cancelled_count != '0' && inputs.slack-channel != ''
      uses: slackapi/slack-github-action@v2
      with:
        method: chat.postMessage
        token: ${{ inputs.slack-token }}
        errors: true
        payload: |
          channel: "${{ inputs.slack-channel }}"
          unfurl_links: false
          unfurl_media: false
          blocks:
            - type: section
              text:
                type: mrkdwn
                text: ":no_bell: ${{ steps.cancel-build.outputs.cancelled_count }} Devin reminder(s) cancelled."
            - type: context
              elements:
                - type: mrkdwn
                  text: "${{ steps.cancel-build.outputs.remaining_count }} reminder(s) remaining."

    - name: Print cancel result
      if: steps.resolve.outputs.is_cancel == 'true'
      shell: bash
      run: |
        echo -e "\U0001F515 **Reminders cancelled**\n- cancelled: ${{ steps.cancel-build.outputs.cancelled_count }}\n- remaining: ${{ steps.cancel-build.outputs.remaining_count }}" | tee -a "$GITHUB_STEP_SUMMARY"

    # --- CRON steps ---

    - name: Process due reminders (cron)
      id: cron
      if: steps.resolve.outputs.is_cron == 'true' && steps.list.outputs.due_count != '0'
      shell: bash
      env:
        DUE_JSON: ${{ steps.list.outputs.due_json }}
        DEVIN_TOKEN: ${{ inputs.devin-token }}
        ORG_ID: ${{ inputs.org-id }}
      run: |
        set -euo pipefail

        DUE_COUNT="$(echo "${DUE_JSON}" | jq 'length')"
        echo "Processing ${DUE_COUNT} due reminder(s)..."

        FIRED_GUIDS="[]"
        FAILED_GUIDS="[]"
        UNDELIVERABLE="[]"

        for i in $(seq 0 $(( DUE_COUNT - 1 ))); do
          ITEM="$(echo "${DUE_JSON}" | jq -c ".[$i]")"
          GUID="$(echo "${ITEM}" | jq -r '.guid')"
          MSG="$(echo "${ITEM}" | jq -r '.reminder_message')"
          SESSION_URL="$(echo "${ITEM}" | jq -r '.agent_session_url')"
          SID_SHORT="$(echo "${ITEM}" | jq -r '.session_id_short // empty')"
          if [ -z "${SID_SHORT}" ]; then
            SESSION_ID="$(echo "${SESSION_URL}" | sed -E 's#.*/sessions/([^/?]+).*#\1#')"
            SID_SHORT="${SESSION_ID:0:8}"
          fi

          echo "Firing reminder ${GUID}: ${MSG}"

          PROMPT="This is a scheduled reminder you set for yourself.

        Reminder message: ${MSG}

        Original session: ${SESSION_URL}"

          SESSION_ID="$(echo "${SESSION_URL}" | sed -E 's#.*/sessions/([^/?]+).*#\1#')"

          PAYLOAD="$(jq -n \
            --arg message "${PROMPT}" \
            '{
              "message": $message
            }')"

          # Use v3 org-scoped endpoint when org-id is provided, otherwise fall back to v1
          if [ -n "${ORG_ID}" ]; then
            DEVIN_ID="devin-${SESSION_ID}"
            API_URL="https://api.devin.ai/v3/organizations/${ORG_ID}/sessions/${DEVIN_ID}/messages"
          else
            API_URL="https://api.devin.ai/v1/sessions/${SESSION_ID}/message"
          fi

          RESPONSE="$(curl -s -w "\nHTTP_STATUS:%{http_code}" -X POST \
            -H "Authorization: Bearer ${DEVIN_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "${PAYLOAD}" \
            "${API_URL}" 2>&1)"

          HTTP_STATUS="$(echo "${RESPONSE}" | grep "HTTP_STATUS:" | cut -d':' -f2)"
          RESPONSE_BODY="$(echo "${RESPONSE}" | sed '/HTTP_STATUS:/d')"

          if [[ "${HTTP_STATUS}" -ge 200 && "${HTTP_STATUS}" -lt 300 ]]; then
            RESPONSE="OK"
          elif [[ "${HTTP_STATUS}" == "403" || "${HTTP_STATUS}" == "404" || "${HTTP_STATUS}" == "410" ]]; then
            echo "::warning::Session ${SESSION_ID} unreachable (HTTP ${HTTP_STATUS}); dropping reminder ${GUID}: ${RESPONSE_BODY}"
            RESPONSE="SESSION_UNREACHABLE"
          else
            echo "::warning::Message endpoint returned HTTP ${HTTP_STATUS} for session ${SESSION_ID}: ${RESPONSE_BODY}"
            RESPONSE="API_CALL_FAILED"
          fi

          if [ "${RESPONSE}" = "API_CALL_FAILED" ]; then
            echo "::error::Failed to fire reminder ${GUID}"
            FAILED_GUIDS="$(echo "${FAILED_GUIDS}" | jq -c --arg g "${GUID}" '. + [$g]')"
          elif [ "${RESPONSE}" = "SESSION_UNREACHABLE" ]; then
            UNDELIVERABLE="$(echo "${UNDELIVERABLE}" | jq -c --arg g "${GUID}" --arg s "${HTTP_STATUS}" '. + [{guid: $g, http_status: $s}]')"
          else
            echo "Reminder ${GUID} fired successfully"
            echo "Response: ${RESPONSE}"
            FIRED_GUIDS="$(echo "${FIRED_GUIDS}" | jq -c --arg g "${GUID}" '. + [$g]')"
          fi
        done

        echo "fired_guids=$(echo "${FIRED_GUIDS}" | jq -c .)" | tee -a "$GITHUB_OUTPUT"
        FIRED_COUNT="$(echo "${FIRED_GUIDS}" | jq 'length')"
        echo "fired_count=${FIRED_COUNT}" | tee -a "$GITHUB_OUTPUT"

        echo "failed_guids=$(echo "${FAILED_GUIDS}" | jq -c .)" | tee -a "$GITHUB_OUTPUT"
        FAILED_COUNT="$(echo "${FAILED_GUIDS}" | jq 'length')"
        echo "failed_count=${FAILED_COUNT}" | tee -a "$GITHUB_OUTPUT"

        echo "undeliverable_json=$(echo "${UNDELIVERABLE}" | jq -c .)" | tee -a "$GITHUB_OUTPUT"
        UNDELIVERABLE_GUIDS="$(echo "${UNDELIVERABLE}" | jq -c '[.[].guid]')"
        echo "undeliverable_guids=${UNDELIVERABLE_GUIDS}" | tee -a "$GITHUB_OUTPUT"
        UNDELIVERABLE_COUNT="$(echo "${UNDELIVERABLE}" | jq 'length')"
        echo "undeliverable_count=${UNDELIVERABLE_COUNT}" | tee -a "$GITHUB_OUTPUT"

        POP_GUIDS="$(jq -cn --argjson a "${FIRED_GUIDS}" --argjson b "${UNDELIVERABLE_GUIDS}" '$a + $b')"
        echo "pop_guids=${POP_GUIDS}" | tee -a "$GITHUB_OUTPUT"
        echo "pop_count=$(echo "${POP_GUIDS}" | jq 'length')" | tee -a "$GITHUB_OUTPUT"

    - name: Slack notification (cron)
      if: steps.resolve.outputs.is_cron == 'true' && steps.cron.outputs.pop_count != '0' && steps.cron.outputs.pop_count != '' && inputs.slack-channel != ''
      shell: bash
      env:
        DUE_JSON: ${{ steps.list.outputs.due_json }}
        FIRED_GUIDS: ${{ steps.cron.outputs.fired_guids }}
        UNDELIVERABLE_JSON: ${{ steps.cron.outputs.undeliverable_json }}
        UNDELIVERABLE_CC: ${{ inputs.undeliverable-cc }}
        SLACK_TOKEN: ${{ inputs.slack-token }}
        SLACK_CHANNEL: ${{ inputs.slack-channel }}
      run: |
        set -euo pipefail

        DUE_COUNT="$(echo "${DUE_JSON}" | jq 'length')"

        for i in $(seq 0 $(( DUE_COUNT - 1 ))); do
          ITEM="$(echo "${DUE_JSON}" | jq -c ".[$i]")"
          GUID="$(echo "${ITEM}" | jq -r '.guid')"

          IS_FIRED="$(echo "${FIRED_GUIDS}" | jq --arg g "${GUID}" 'index($g) != null')"
          UNDELIVERABLE_STATUS="$(echo "${UNDELIVERABLE_JSON}" | jq -r --arg g "${GUID}" '.[] | select(.guid == $g) | .http_status')"
          if [ "${IS_FIRED}" != "true" ] && [ -z "${UNDELIVERABLE_STATUS}" ]; then
            continue
          fi

          MSG="$(echo "${ITEM}" | jq -r '.reminder_message')"
          SESSION_URL="$(echo "${ITEM}" | jq -r '.agent_session_url')"
          SLACK_CC="$(echo "${ITEM}" | jq -r '.slack_users_cc // empty')"
          SID_SHORT="$(echo "${ITEM}" | jq -r '.session_id_short // empty')"
          if [ -z "${SID_SHORT}" ]; then
            SESSION_ID="$(echo "${SESSION_URL}" | sed -E 's#.*/sessions/([^/?]+).*#\1#')"
            SID_SHORT="${SESSION_ID:0:8}"
          fi

          if [ -n "${UNDELIVERABLE_STATUS}" ]; then
            HEADLINE=":warning: Devin reminder dropped — session unreachable (HTTP ${UNDELIVERABLE_STATUS}):"
            FOOTER="Target session <${SESSION_URL}|${SID_SHORT}> is archived, deleted, or no longer accessible. The reminder was removed and will not retry."
            if [ -n "${UNDELIVERABLE_CC}" ]; then
              SLACK_CC="${SLACK_CC:+${SLACK_CC}, }${UNDELIVERABLE_CC}"
            fi
          else
            HEADLINE=":bell: Devin reminder delivered:"
            FOOTER="Sent by <http://Devin.ai|Devin.ai> (No-Reply) from session <${SESSION_URL}|${SID_SHORT}>."
          fi

          CC_LINE=""
          if [ -n "${SLACK_CC}" ]; then
            CC_LINE="\nCC: ${SLACK_CC}"
          fi

          PAYLOAD="$(jq -n \
            --arg channel "${SLACK_CHANNEL}" \
            --arg headline "${HEADLINE}" \
            --arg msg "${MSG}" \
            --arg footer "${FOOTER}" \
            --arg cc "${CC_LINE}" \
            '{
              channel: $channel,
              unfurl_links: false,
              unfurl_media: false,
              blocks: [
                {type: "section", text: {type: "mrkdwn", text: $headline}},
                {type: "section", text: {type: "mrkdwn", text: ("> *" + $msg + "*")}},
                {type: "context", elements: [{type: "mrkdwn", text: ($footer + $cc)}]}
              ]
            }')"

          curl -sf -X POST \
            -H "Authorization: Bearer ${SLACK_TOKEN}" \
            -H "Content-Type: application/json; charset=utf-8" \
            -d "${PAYLOAD}" \
            "https://slack.com/api/chat.postMessage" > /dev/null || echo "::warning::Failed to send Slack notification for reminder ${GUID}"
        done

    - name: Pop fired and undeliverable reminders (cron)
      id: pop
      if: steps.resolve.outputs.is_cron == 'true' && steps.cron.outputs.pop_count != '0' && steps.cron.outputs.pop_count != ''
      shell: bash
      env:
        CURRENT_JSON: ${{ steps.list.outputs.reminders_json }}
        POP_GUIDS: ${{ steps.cron.outputs.pop_guids }}
      run: |
        set -euo pipefail

        REMAINING="$(echo "${CURRENT_JSON}" | jq -c --argjson guids "${POP_GUIDS}" '[.[] | select(.guid as $g | $guids | index($g) | not)]')"

        mkdir -p /tmp/reminders-upload
        echo "${REMAINING}" | jq . > /tmp/reminders-upload/reminders.json

        echo "Remaining list:"
        cat /tmp/reminders-upload/reminders.json

        REMAINING_COUNT="$(echo "${REMAINING}" | jq 'length')"
        POPPED_COUNT="$(echo "${POP_GUIDS}" | jq 'length')"
        echo "remaining_count=${REMAINING_COUNT}" | tee -a "$GITHUB_OUTPUT"
        echo "popped_count=${POPPED_COUNT}" | tee -a "$GITHUB_OUTPUT"

    - name: Upload reminders artifact (cron pop)
      if: steps.resolve.outputs.is_cron == 'true' && steps.cron.outputs.pop_count != '0' && steps.cron.outputs.pop_count != ''
      uses: actions/upload-artifact@v4
      with:
        name: ${{ steps.resolve.outputs.artifact_name }}
        path: /tmp/reminders-upload/reminders.json
        retention-days: 4
        overwrite: true

    - name: Release artifact lock
      if: >
        always() &&
        steps.lock-acquire.outcome == 'success'
      uses: guibranco/github-artifact-lock-action/release-lock@v3.0.14
      with:
        lock-name: devin-reminders-lock

    - name: Print cron result
      if: steps.resolve.outputs.is_cron == 'true'
      shell: bash
      run: |
        if [ "${{ steps.list.outputs.due_count }}" = "0" ]; then
          echo "🔔 **Cron** at \`${{ steps.resolve.outputs.now }}\` — total ${{ steps.list.outputs.total_count }}, due 0." | tee -a "$GITHUB_STEP_SUMMARY"
        else
          echo -e "🔔 **Cron** at \`${{ steps.resolve.outputs.now }}\`\n- total: ${{ steps.list.outputs.total_count }}\n- due: ${{ steps.list.outputs.due_count }}\n- fired: ${{ steps.cron.outputs.fired_count }}\n- failed: ${{ steps.cron.outputs.failed_count }}\n- undeliverable (dropped): ${{ steps.cron.outputs.undeliverable_count }}\n- popped: ${{ steps.pop.outputs.popped_count }}\n- remaining: ${{ steps.pop.outputs.remaining_count }}" | tee -a "$GITHUB_STEP_SUMMARY"
        fi

    - name: Fail if any reminders could not be delivered
      if: steps.resolve.outputs.is_cron == 'true' && steps.cron.outputs.failed_count != '0' && steps.cron.outputs.failed_count != ''
      shell: bash
      run: |
        echo "::error::${{ steps.cron.outputs.failed_count }} reminder(s) failed to fire. Failed GUIDs: ${{ steps.cron.outputs.failed_guids }}"
        exit 1
